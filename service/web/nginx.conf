server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # 面板要求实时, 页面/样式/脚本一律不许被浏览器或 CDN 缓存住,
    # 否则每次更新前端都得手动 purge 一次 CDN。
    # no-cache = 允许存但必须回源校验(命中 304 很便宜), 不是 no-store。
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ =404;
    }

    # 探针数据 1.5s 拉一次, 彻底不缓存
    location /json/ {
        add_header Cache-Control "no-store" always;
    }
}
